[project]
name = "pressure-lab"
version = "0.1.0"
description = "Loading, calibration, event analysis and paper-style plotting for the FSR ring pressure measurements."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pressure_lab", "pressure_lab.io", "pressure_lab.calibration", "pressure_lab.analysis", "pressure_lab.plotting"]
